{% extends 'leads/base.html' %}
{% block title %}{{ title }} - Travel CRM{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<div class="form-card">
    <div class="form-card-header"><h2>{{ title }}</h2></div>
    <div class="form-card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label class="field-label">Campaign Name <span class="required">*</span></label>
                <input type="text" name="name" class="form-control" required placeholder="e.g. Summer Umrah Offer 2026">
            </div>
            <div class="form-group">
                <label class="field-label">Subject <span class="required">*</span></label>
                <input type="text" name="subject" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="field-label">Body <span class="required">*</span></label>
                <textarea name="body" class="form-control" rows="8" required></textarea>
            </div>

            <h3 style="margin:24px 0 12px; font-size:16px;">Audience Segment (leave blank to include everyone with an email)</h3>
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Destination contains</label>
                    <input type="text" name="filter_destination" class="form-control" placeholder="e.g. Dubai">
                </div>
                <div class="form-group">
                    <label class="field-label">Trip Type</label>
                    <input type="text" name="filter_trip_type" class="form-control" placeholder="e.g. umrah, honeymoon">
                </div>
            </div>
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Lead Status</label>
                    <input type="text" name="filter_lead_status" class="form-control" placeholder="e.g. positive">
                </div>
                <div class="form-group">
                    <label class="field-label">Country contains</label>
                    <input type="text" name="filter_country" class="form-control">
                </div>
            </div>
            <div class="form-actions">
                <a href="{% url 'bulk_email_list' %}" style="margin-right:12px; color:#666;">Cancel</a>
                <button type="submit" class="btn">Build Campaign (Draft)</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
