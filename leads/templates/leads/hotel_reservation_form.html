{% extends 'leads/base.html' %}
{% block title %}{{ title }} - Travel CRM{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<div class="form-card">
    <div class="form-card-header"><h2>{{ title }}</h2></div>
    <div class="form-card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Hotel</label>
                    <select name="hotel" class="form-control">
                        <option value="">-- Select Hotel --</option>
                        {% for h in hotels %}
                        <option value="{{ h.pk }}" {% if res.hotel_id == h.pk %}selected{% endif %}>{{ h.name }} ({{ h.city }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Lead / Customer</label>
                    <select name="lead" class="form-control">
                        <option value="">-- Select --</option>
                        {% for l in leads %}
                        <option value="{{ l.pk }}" {% if res.lead_id == l.pk %}selected{% endif %}>{{ l.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Room Type</label>
                    <input type="text" name="room_type" class="form-control" placeholder="e.g. Deluxe Double" value="{{ res.room_type|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Meal Plan</label>
                    <select name="meal_plan" class="form-control">
                        {% for val, label in meal_plans %}
                        <option value="{{ val }}" {% if res.meal_plan == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Check-in</label>
                    <input type="date" name="check_in" class="form-control" value="{{ res.check_in|date:'Y-m-d'|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Check-out</label>
                    <input type="date" name="check_out" class="form-control" value="{{ res.check_out|date:'Y-m-d'|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Nights</label>
                    <input type="number" name="nights" class="form-control" min="1" value="{{ res.nights|default:1 }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Rooms</label>
                    <input type="number" name="rooms" class="form-control" min="1" value="{{ res.rooms|default:1 }}">
                </div>
            </div>
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Rate per Night</label>
                    <input type="number" step="0.01" name="rate_per_night" class="form-control" value="{{ res.rate_per_night|default:0 }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Confirmation Number</label>
                    <input type="text" name="confirmation_number" class="form-control" value="{{ res.confirmation_number|default:'' }}">
                </div>
            </div>
            <div class="form-group">
                <label class="field-label">Cancellation Policy</label>
                <textarea name="cancellation_policy" class="form-control" rows="2">{{ res.cancellation_policy|default:'' }}</textarea>
            </div>
            <div class="form-row" style="grid-template-columns: 1fr;">
                <div class="form-group">
                    <label class="field-label">Status</label>
                    <select name="status" class="form-control">
                        <option value="draft" {% if res.status == 'draft' %}selected{% endif %}>Draft</option>
                        <option value="confirmed" {% if res.status == 'confirmed' %}selected{% endif %}>Confirmed</option>
                        <option value="cancelled" {% if res.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                        <option value="completed" {% if res.status == 'completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="field-label">Notes</label>
                <textarea name="notes" class="form-control" rows="2">{{ res.notes|default:'' }}</textarea>
            </div>
            <div class="form-actions">
                <a href="{% url 'hotel_reservation_list' %}" style="margin-right:12px; color:#666;">Cancel</a>
                <button type="submit" class="btn">{% if res %}Save Changes{% else %}Create Reservation{% endif %}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
