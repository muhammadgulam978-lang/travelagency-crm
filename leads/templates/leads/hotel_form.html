{% extends 'leads/base.html' %}
{% block title %}{{ title }} - Travel CRM{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<div class="form-card">
    <div class="form-card-header"><h2>{{ title }}</h2></div>
    <div class="form-card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Hotel Name <span class="required">*</span></label>
                    <input type="text" name="name" class="form-control" required value="{{ hotel.name|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Star Rating</label>
                    <select name="star_rating" class="form-control">
                        {% for val, label in star_choices %}
                        <option value="{{ val }}" {% if hotel.star_rating == val %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">City <span class="required">*</span></label>
                    <input type="text" name="city" class="form-control" required value="{{ hotel.city|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Country</label>
                    <input type="text" name="country" class="form-control" value="{{ hotel.country|default:'' }}">
                </div>
            </div>
            <div class="form-group">
                <label class="field-label">Address</label>
                <input type="text" name="address" class="form-control" value="{{ hotel.address|default:'' }}">
            </div>
            <div class="form-row" style="grid-template-columns: 1fr 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Contact Person</label>
                    <input type="text" name="contact_person" class="form-control" value="{{ hotel.contact_person|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ hotel.phone|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ hotel.email|default:'' }}">
                </div>
            </div>
            <div class="form-group">
                <label class="field-label">Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ hotel.notes|default:'' }}</textarea>
            </div>
            <div class="form-actions">
                <a href="{% url 'hotel_list' %}" style="margin-right:12px; color:#666;">Cancel</a>
                <button type="submit" class="btn">{% if hotel %}Save Changes{% else %}Add Hotel{% endif %}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
